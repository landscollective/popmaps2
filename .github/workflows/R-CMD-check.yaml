name: R-CMD-check

"on":
  # Run routine package checks on pull requests only. The PR check is the gate;
  # skipping the post-merge push run avoids spending minutes on the same commit
  # twice after a squash merge.
  pull_request:
    branches: [main]
    paths:
      - ".Rbuildignore"
      - ".github/workflows/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "data/**"
      - "inst/**"
      - "man/**"
      - "tests/**"
      - "vignettes/**"
  workflow_dispatch:
    inputs:
      run_macos:
        description: "Also run macOS check"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check-linux:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  R-CMD-check-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos }}
    runs-on: macos-latest
    name: macos-latest (release, manual)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
