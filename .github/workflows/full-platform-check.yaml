name: Full platform R-CMD-check

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check, such as main, a tag, or a commit SHA"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  R-CMD-check:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: full / ubuntu-latest (release)
            os: ubuntu-latest
            r: release
          - label: full / ubuntu-latest (devel)
            os: ubuntu-latest
            r: devel
          - label: full / macos-latest (release)
            os: macos-latest
            r: release
          - label: full / windows-latest (release)
            os: windows-latest
            r: release

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
